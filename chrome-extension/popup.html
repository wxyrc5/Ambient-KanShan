<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>桌边看山 · 7 天术语本</title>
  <style>
    body{width:320px;margin:0;padding:14px;font-family:-apple-system,"Noto Sans SC",sans-serif;background:#F8FAFC;color:#0F172A;}
    h3{margin:0 0 8px;font-size:14px;color:#0044B3;}
    .item{background:#fff;border:1px solid #E2E8F0;border-radius:10px;padding:8px 10px;margin-bottom:8px;font-size:12px;}
    .meta{font-size:10px;color:#64748B;margin-top:4px;}
  </style>
</head>
<body>
  <h3>桌边看山 · 近 7 天跨页术语本</h3>
  <div id="list" style="font-size:12px;color:#64748B;">加载中...</div>
  <script>
    chrome.runtime.sendMessage({ type: "GET_MEMORY" }, (res) => {
      const arr = (res && res.list) || [];
      document.getElementById("list").innerHTML = arr.length
        ? arr.map(m => `<div class="item"><strong>${m.term}</strong><div>${m.analogy}</div><div class="meta">${m.pageTitle}</div></div>`).join("")
        : "暂无记录：在知乎或英文论文页面划词即可自动沉淀。";
    });
  </script>
</body>
</html>
